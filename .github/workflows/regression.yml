name: Regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project tests/Regression/Regression.csproj --configuration Release
      - uses: actions/upload-artifact@v4
        with:
          name: ScpEscapeSystem-build
          path: artifacts/ScpEscapeSystem.dll
          if-no-files-found: error
